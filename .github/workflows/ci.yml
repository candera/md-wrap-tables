name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Emacs ${{ matrix.emacs_version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.1', '29.4', '30.1', 'snapshot']
    steps:
      - uses: actions/checkout@v5
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - name: Byte-compile (warnings are errors)
        run: make compile
      - name: Checkdoc
        run: make checkdoc
      - name: ERT tests
        run: make test

  lint:
    name: package-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'
      - name: package-lint
        run: make lint
